# Render Configuration for Nexus Creative Studio
services:
  - type: web
    name: nexus-creative-studio
    env: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-creative-db
          property: connectionString
    domains:
      - nexus-creative-studio.onrender.com

databases:
  - name: nexus-creative-db
    databaseName: nexus_creative
    user: nexus_user
    plan: starter