# Render Configuration for Nexus Creative Studio
services:
  - type: web
    name: nexus-creative-studio
    env: node
    region: oregon
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: "true"
    scaling:
      minInstances: 1
      maxInstances: 1
    disk:
      name: nexus-disk
      mountPath: /tmp
      sizeGB: 1