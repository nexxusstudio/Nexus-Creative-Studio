# Railway Configuration for Nexus Creative Studio
[build]
  builder = "nixpacks"
  buildCommand = "npm run build"

[deploy]
  startCommand = "npm start"
  healthcheckPath = "/health"
  healthcheckTimeout = 300
  restartPolicyType = "on_failure"
  restartPolicyMaxRetries = 10

[variables]
  NODE_ENV = "production"
  
[networking]
  httpTimeout = 300